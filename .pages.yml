content:
  - name: homepage
    label: Teksty strony głównej
    type: file
    path: content/homepage.json
    format: json
    fields:
      - name: pl
        label: Polski
        type: object
        fields:
          - { name: hero, label: Hero, type: object, fields: [
              { name: line1, label: Heading line 1, type: string, required: true },
              { name: line2, label: Heading line 2, type: string, required: true },
              { name: line3, label: Heading line 3, type: string, required: true },
