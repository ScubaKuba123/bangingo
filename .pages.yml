  - name: packages
    label: Teksty pakietów
    type: file
    path: content/packages.json
    format: json
    list: true
    fields:
      - { name: id, label: Package ID, type: string, readonly: true }
      - name: pl
        label: Polish
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: tagline, label: Short description, type: string, required: true }
          - { name: intro, label: Introduction, type: text, required: true }
